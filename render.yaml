# Render Blueprint: the whole app on Render's free plan.
# Dashboard -> New -> Blueprint -> pick this repository -> Apply.
# It creates the web service and a Postgres database, and asks for the
# Telegram bot token (leave it empty to run without phone alerts).
services:
  - type: web
    name: steptosales
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: steptosales-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: steptosales-db
    plan: free
    region: singapore
    databaseName: steptosales
    user: steptosales
